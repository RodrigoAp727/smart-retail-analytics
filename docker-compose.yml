services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-retail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-smart_retail}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-smart_retail}"]
      interval: 10s
      timeout: 5s
      retries: 10

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-retail-pipeline
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
    volumes:
      - ./:/app
    working_dir: /app
    command: >
      sh -c "python src/generator/generate_fake_data.py --output-dir data/raw --sample-dir data/samples &&
      python src/pipeline_main.py --mode full"

volumes:
  postgres_data: